name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }}, ${{ matrix.pillow }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # oldest supported: the floor promised in SKILL.md's compatibility field
          - { os: ubuntu-24.04, python: "3.9", pillow: "pillow==10.1.0" }
          - { os: ubuntu-latest, python: "3.13", pillow: "pillow" }
          - { os: macos-latest, python: "3.13", pillow: "pillow" }
          - { os: windows-latest, python: "3.13", pillow: "pillow" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "${{ matrix.pillow }}"
      - run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck skills/store-assets/scripts/capture.sh
      - name: manifests are valid JSON
        run: for f in .claude-plugin/*.json .codex-plugin/*.json .cursor-plugin/*.json gemini-extension.json skills/store-assets/scripts/specs.json skills/store-assets/assets/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done

  # Publishes a GitHub Release when main carries a version that has no release yet.
  # The version comes from SKILL.md; tests/test_packaging.py keeps every manifest in sync with it.
  release:
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: create release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^  version: "\(.*\)"/\1/p' skills/store-assets/SKILL.md | head -n1)
          [ -n "$version" ] || { echo "no version found in SKILL.md"; exit 1; }
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released, nothing to do"
            exit 0
          fi
          awk -v v="$version" '/^## /{p = index($0, "## " v) == 1; next} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file notes.md
